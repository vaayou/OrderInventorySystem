# yaml
# Production compose — uses Aiven MySQL (external). No local DB container.
# Requires: .env with Aiven credentials, and ./ssl/ca.p12 (converted from Aiven ca.pem)

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: heavycoder/order-inventory-frontend:latest
    container_name: order-inventory-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - order-inventory-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./OrderInvertory
      dockerfile: Dockerfile
    image: heavycoder/order-inventory-backend:latest
    container_name: order-inventory-backend
    restart: unless-stopped
    environment:
      # Aiven MySQL — SSL enabled (ca.p12 mounted from ./ssl/)
      SPRING_DATASOURCE_URL: jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/${AIVEN_DB}?sslMode=VERIFY_CA&serverSslCert=/ssl/ca.pem&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${AIVEN_USER}
      SPRING_DATASOURCE_PASSWORD: ${AIVEN_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      # Mount ssl/ so ca.pem lands at /etc/secrets/ca.pem — same path as Render Secret File
      - ./ssl:/etc/secrets:ro
    ports:
      - "8080:8080"
    networks:
      order-inventory-network:
        aliases:
          - order-inventory-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  order-inventory-network:
    driver: bridge
